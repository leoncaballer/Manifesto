<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Preview Minimal</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=boska@500,700&display=swap" rel="stylesheet" />
  <style>
    :root, html[data-theme="light"] { --bg:#f5f0e6; --surface:#fbf6ee; --surface2:#fffaf4; --border:#d8cbbb; --text:#3d2a24; --muted:#7c625c; --inverse:#fff8f3; --primary:#7b1b38; --primaryHover:#64152e; --primaryHi:#ead7dd; --radius:1rem; --shadow:0 10px 30px rgba(0,0,0,.09); --fontBody:'Satoshi', Inter, sans-serif; --fontDisplay:'Boska', Georgia, serif; }
    html[data-theme="dark"] { --bg:#211817; --surface:#2a1f1e; --surface2:#312523; --border:#584542; --text:#efe4d7; --muted:#c7b6ab; --inverse:#1f1514; --primary:#c07a8f; --primaryHover:#d08ea1; --primaryHi:#4a3038; --shadow:0 10px 30px rgba(0,0,0,.35); }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:var(--fontBody);color:var(--text);background:linear-gradient(180deg,var(--bg),var(--surface));display:grid;place-items:center;padding:24px}
    .panel{width:min(520px,100%);background:color-mix(in srgb,var(--surface2) 88%, transparent);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
    h2{margin:0 0 8px;font-size:2rem;font-family:var(--fontDisplay)} p{margin:0;color:var(--muted);line-height:1.6}
    .field{display:grid;gap:8px;margin-top:22px} label{font-size:.9rem;font-weight:700} input{width:100%;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent}.btn-primary{background:var(--primary);color:var(--inverse)}
    .feedback{min-height:1.5em;margin-top:10px;font-size:.9rem;color:#b42318}
    .proceed-wrap{display:none;min-height:220px;align-items:center;justify-content:center}.proceed-wrap.visible{display:grid}
    .proceed-link{display:inline-flex;align-items:center;justify-content:center;min-width:220px;min-height:62px;padding:0 28px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none;font-weight:700;letter-spacing:.04em;box-shadow:var(--shadow)}
    .login-view.hidden{display:none}
  </style>
</head>
<body>
  <section class="panel">
    <div id="loginView" class="login-view">
      <h2>Enter password</h2>
      <p>to gain access to my manifesto.</p>
      <div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="Type password" /></div>
      <div class="actions"><button class="btn btn-primary" id="unlockBtn" type="button">Unlock</button></div>
    </div>
    <div id="proceedWrap" class="proceed-wrap" aria-live="polite">
      <a class="proceed-link" href="new-page.html">PROCEED</a>
    </div>
  </section>
  <script>
    const DEMO_PASSWORD = 'opensesame';
    const input = document.getElementById('password');
    const feedback = document.getElementById('feedback');
    const proceedWrap = document.getElementById('proceedWrap');
    const loginView = document.getElementById('loginView');
    document.getElementById('unlockBtn').addEventListener('click', () => {
      if (input.value.trim() === DEMO_PASSWORD) {
        loginView.classList.add('hidden');
        proceedWrap.classList.add('visible');
      } else {
        feedback.textContent = 'Incorrect password.';
      }
    });
  </script>
</body>
</html>
